name: CD

on:
  push:
    branches: [master]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/aidas-web

jobs:

  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ────────────────────────────────────────────────────────────────
  # JOB 2. deploy-ec2 — EC2에 SSH 접속 후 컨테이너 재배포
  # build-push 성공 후에만 실행 (needs: build-push)
  # Docker Hub에서 새 이미지를 pull 후 기존 컨테이너 교체
  #
  # [현재 제약] EC2가 private subnet에 있어 직접 SSH 불가
  #   → 현재는 public IP를 가진 EC2 또는 Tailscale 경유를 가정
  #   → 향후 AWS SSM Run Command 방식으로 교체 예정 (cicd-report.md 참고)
  # ────────────────────────────────────────────────────────────────
  deploy-ec2:
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - name: EC2에 SSH 접속 후 컨테이너 재배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}

            docker stop aidas-web || true
            docker rm   aidas-web || true

            docker run -d \
              --name aidas-web \
              --restart unless-stopped \
              -p 8000:8000 \
              -e DB_URL=${{ secrets.DB_URL }} \
              ${{ env.IMAGE_NAME }}:${{ github.sha }}

            docker image prune -f

  # ────────────────────────────────────────────────────────────────
  # JOB 3. notify — Slack으로 배포 결과 알림
  # build-push / deploy-ec2 결과에 상관없이 항상 실행 (if: always())
  # 성공 / 실패 여부를 Slack 채널에 전송
  # ────────────────────────────────────────────────────────────────
  notify:
    runs-on: ubuntu-latest
    needs: [build-push, deploy-ec2]
    if: always()

    steps:
      - name: Slack 배포 결과 알림
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
