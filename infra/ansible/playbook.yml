#/home/user1/aidas/infra/ansible/playbook.yml
---
- name: 온프레미스 서버 기반 환경 구성
  hosts: onpremise 
  become: true
  vars:
    promtail_version: "2.9.9"
    promtail_install_dir: /usr/local/bin
    promtail_config_dir: /etc/promtail
    promtail_positions_dir: /var/lib/promtail
    aidas_log_dir: /var/log/aidas

  tasks:
    # -------------------------------------------------------------------------
    # Docker 설치
    # -------------------------------------------------------------------------
    - name: Docker 의존성 패키지 설치
      dnf:
        name:
          - yum-utils
          - device-mapper-persistent-data
          - lvm2
        state: present

    - name: Docker CE 저장소 추가
      get_url:
        url: https://download.docker.com/linux/centos/docker-ce.repo
        dest: /etc/yum.repos.d/docker-ce.repo
        mode: "0644"

    - name: Docker CE 패키지 설치
      dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        allowerasing: true

    - name: Docker 서비스 활성화 및 시작
      systemd:
        name: docker
        state: started
        enabled: true

    - name: 접속 계정을 docker 그룹에 추가
      user:
        name: "{{ ansible_user | default(ansible_user_id) }}"
        groups: docker
        append: true

    # -------------------------------------------------------------------------
    # Promtail 설치 
    # -------------------------------------------------------------------------
    - name: Promtail 설치 여부 확인
      stat:
        path: "{{ promtail_install_dir }}/promtail"
      register: promtail_bin

    - name: unzip 패키지 설치
      dnf:
        name: unzip
        state: present

    - name: Promtail 바이너리 다운로드
      get_url:
        url: "https://github.com/grafana/loki/releases/download/v{{ promtail_version }}/promtail-linux-amd64.zip"
        dest: "/tmp/promtail-{{ promtail_version }}.zip"
        mode: "0644"
      when: not promtail_bin.stat.exists

    - name: Promtail 압축 해제
      unarchive:
        src: "/tmp/promtail-{{ promtail_version }}.zip"
        dest: /tmp/
        remote_src: true
        creates: /tmp/promtail-linux-amd64
      when: not promtail_bin.stat.exists

    - name: Promtail 바이너리 배치
      copy:
        src: /tmp/promtail-linux-amd64
        dest: "{{ promtail_install_dir }}/promtail"
        mode: "0755"
        remote_src: true
        force: false
      when: not promtail_bin.stat.exists

    - name: Promtail 설정 및 데이터 디렉토리 생성
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ promtail_config_dir }}"
        - "{{ promtail_positions_dir }}"
        - "{{ aidas_log_dir }}"

    - name: Promtail 설정 파일 배포
      template:
        src: templates/promtail-config.yml.j2
        dest: "{{ promtail_config_dir }}/config.yml"
        mode: "0644"
      notify: Promtail 재시작

    - name: Promtail systemd 서비스 파일 배포
      copy:
        dest: /etc/systemd/system/promtail.service
        mode: "0644"
        content: |
          [Unit]
          Description=Promtail - Loki Log Shipping Agent
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=root
          ExecStart={{ promtail_install_dir }}/promtail -config.file={{ promtail_config_dir }}/config.yml
          Restart=on-failure
          RestartSec=5s

          [Install]
          WantedBy=multi-user.target
      notify: Promtail 재시작

    - name: systemd 데몬 리로드
      systemd:
        daemon_reload: true

    - name: Promtail 서비스 활성화 및 시작
      systemd:
        name: promtail
        state: started
        enabled: true

   # -------------------------------------------------------------------------
    # 🎯 [추가 미션 자동화 섹션]  NFS 볼륨 동기화 및 자동 배포
    # -------------------------------------------------------------------------
    - name: "인프라 완공 부부 임무: 원격지 권한 거부 문제 해결"
      shell: |
        ssh -o StrictHostKeyChecking=no user1@172.16.8.203 "sudo ufw disable && sudo mkdir -p /home/user1/aidas/nfs_db_data && sudo chmod 777 /home/user1/aidas/nfs_db_data"
        ssh -o StrictHostKeyChecking=no user1@172.16.8.203 "echo '/home/user1/aidas/nfs_db_data 172.16.8.202(rw,sync,no_subtree_check,no_root_squash)' | sudo tee -a /etc/exports && sudo systemctl restart nfs-kernel-server"
      delegate_to: localhost
      ignore_errors: true

    - name: "인프라 완공 부부 임무: rocky02 본체 방화벽 해제 및 NFS 원격 마운트"
      shell: |
        sudo systemctl stop firewalld
        sudo mkdir -p /home/user1/aidas/db_data
        sudo mount -t nfs 172.16.8.203:/home/user1/aidas/nfs_db_data /home/user1/aidas/db_data
      ignore_errors: true

    - name: "인프라 완공 부부 임무: 각각 서버에 알맞은 컴포즈 설계도 수송 및 자동 배포 구동 슛"
      shell: |
        # 1. rocky02 자리에 메인 컴포즈 복사 후 구동
        cp /home/user1/aidas/docker-compose-rocky.yml /home/user1/aidas/docker-compose.yml
        cd /home/user1/aidas && IMAGE_NAME=postgres:15 docker compose up -d
        
        # 2. 원격 ubuntu01 서버 디렉토리 소유권 선점
        ssh -o StrictHostKeyChecking=no user1@172.16.8.203 "sudo mkdir -p /home/user1/aidas && sudo chown -R user1:user1 /home/user1/aidas"
        
        # 3. 무한 재부팅 루프에 걸린 뇌사 상태의 구형 컨테이너를 확실하게 셧다운(clear) 시킵니다!
        ssh -o StrictHostKeyChecking=no user1@172.16.8.203 "cd /home/user1/aidas && docker compose down"
        
        # 4. 수정된 컴포즈 파일을 ubuntu01 서버로 배달
        scp /home/user1/aidas/docker-compose-ubuntu.yml user1@172.16.8.203:/home/user1/aidas/docker-compose.yml
        
        # 5. 깨끗해진 방에 새 설계도로 재부팅 슛!
        ssh -o StrictHostKeyChecking=no user1@172.16.8.203 "cd /home/user1/aidas && IMAGE_NAME=postgres:15 docker compose up -d"
      delegate_to: localhost